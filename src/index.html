<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>CaretEDA | AI-native, Silicon-ready, Open-Source enabled</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/careteda-logo-64.png">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9">
  <script>
    // Theme before first paint (no flash): the visitor's stored choice, else the OS setting.
    (function(d) {
      var t = null;
      try { t = localStorage.getItem('careteda-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') d.querySelector('meta[name="theme-color"]').setAttribute('content', '#07090e');
    }(document));
  </script>

  <!-- Fonts: declared here (not via @import in CSS) so the browser finds them early.
       The production build inlines this stylesheet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- SEO / social link previews -->
  <meta name="description" content="CaretEDA automates chip design from natural-language specification to silicon-ready netlist with its AI-native Spec-to-Netlist™ platform — integrating open-source and commercial EDA tools.">

  <!-- Open Graph (LinkedIn, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CaretEDA">
  <meta property="og:title" content="CaretEDA | AI-native, Silicon-ready, Open-Source enabled">
  <meta property="og:description" content="CaretEDA automates chip design from natural-language specification to silicon-ready netlist with its AI-native Spec-to-Netlist™ platform.">
  <meta property="og:url" content="https://careteda.com/">
  <meta property="og:image" content="https://careteda.com/assets/careteda-logo-hd.png">
  <meta property="og:image:alt" content="CaretEDA">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CaretEDA | AI-native, Silicon-ready, Open-Source enabled">
  <meta name="twitter:description" content="CaretEDA automates chip design from natural-language specification to silicon-ready netlist with its AI-native Spec-to-Netlist™ platform.">
  <meta name="twitter:image" content="https://careteda.com/assets/careteda-logo-hd.png">
  <script>
    // GitHub Pages SPA — restore path from query string redirect
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
